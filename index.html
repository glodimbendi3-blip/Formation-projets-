<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <main>
    <section id="#home" class="ecran-actif mode">
    <div class="top">
        <div class="logo">
            <img src="logo/Gshop-logo.png" alt="logo du site">
        </div>
        <div class="home-texte">
    <h1>Gestion<span class="sh">Shop</span></h1>
    <p class="description">
        Gérez vos ventes, suivez vos recettes, boostez votre activité !
    </p>
    </div>
    </div>
    <div class="start">
        <button> <a href="#connexion">commencer  ></a> </button>
    </div>
   </section>

   <section id="connexion" class="ecran mode">
    <div class="top top-connect">
        <div class="logo">
            <img src="logo/Gshop-logo.png" alt="logo du site">
        </div>
        <div class="home-texte">
    <h1> <span class="G">Gestion</span> <span class="sh sp">Shop</span></h1>
    <p class="paragraphe-style">
       Connectez-vous à votre compte
    </p>
    </div>
    </div>
    <div class="formulaire">
        <form action="connexion">
            <div class="champ-containeur">
            <div class="champ">
                <div class="icone"><img src="icones/phone.svg" alt="icone-appel"></div>
                <div class="label-input">
                    <label for="telephone" class="paragraphe-style">Numéro de téléphone</label>
                    <input type="number" placeholder="Ex : +243 83 222 1780">
                </div>
            </div>
            <div class="champ">
                <div class="icone"><img src="icones/phone.svg" alt="icone-appel"></div>
                <div class="label-input">
                    <label for="telephone" class="paragraphe-style">Mot de  passe</label>
                    <input type="password" required placeholder="xxxxxxxx">
                </div>
            </div>
            </div>
            <div class="dec">
                <div class="to-left">
                        <input type="checkbox">
                        <label for="connect" class="paragraphe-style">
                            Se souvenir de moi</label>
                </div>
                <div class="to-right">
                    <a href="#" class="paragraphe-style">
                        Mot de passe oublié ?
                    </a>
                </div>
            </div>
            <div class="connecter-butt start">
                <button>Se connecter</button>
            </div>
            <div class="create-count">
                <p class="paragraphe-style">
                    Vous n'avez pas de compte ?
                </p>
                <a href="#" class="paragraphe-style">S'incrire</a>
            </div>
        </form>
    </div>
   </section>
   </main>
</body>
</html>
